<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kiln — UI Preview</title>
<!--
  Fully self-contained preview of the Kiln UI. No network, no CDN, no build step —
  vanilla JS mirroring ui/src (same stylesheet, same layout & flows, mock backend).
  This file is for design review only; the real source Codex integrates is ui/src/.
-->
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --bg: #f5f5f7; --bg-raised: #ffffff; --bg-sidebar: rgba(246, 246, 248, 0.9);
  --bg-inset: #ececee; --bg-hover: rgba(0,0,0,0.045); --bg-active: rgba(0,0,0,0.08);
  --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.16);
  --text: #1d1d1f; --text-2: #6e6e73; --text-3: #aeaeb2;
  --accent: #0071e3; --accent-hover: #0077ed; --accent-text: #ffffff;
  --green: #28a745; --red: #e0303e; --amber: #b8860b;
  --shadow-card: 0 1px 3px rgba(0,0,0,.07), 0 4px 14px rgba(0,0,0,.05);
  --shadow-pop: 0 8px 40px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.10);
  --radius: 10px; --radius-sm: 7px; --titlebar-h: 44px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1e20; --bg-raised: #29292c; --bg-sidebar: rgba(30,30,33,0.85);
    --bg-inset: #161618; --bg-hover: rgba(255,255,255,0.06); --bg-active: rgba(255,255,255,0.10);
    --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
    --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #636366;
    --accent: #0a84ff; --accent-hover: #2f95ff;
    --green: #32d74b; --red: #ff453a; --amber: #ffd60a;
    --shadow-card: 0 1px 3px rgba(0,0,0,.4);
    --shadow-pop: 0 8px 40px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { font-family: var(--font); font-size: 13px; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: var(--text); }
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
svg { flex: 0 0 auto; }
.app { display: flex; flex-direction: column; height: 100%; }
.titlebar { height: var(--titlebar-h); flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 84px; background: transparent; }
.titlebar-title { font-weight: 600; font-size: 13px; }
.titlebar-spacer { flex: 1; }
.content { flex: 1; min-height: 0; display: flex; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-raised); cursor: pointer; font-size: 13px; font-weight: 500; transition: background .12s, border-color .12s, opacity .12s; white-space: nowrap; }
.btn:hover { background: var(--bg-hover); }
.btn:active { background: var(--bg-active); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-text); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--red); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--bg-hover); }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn.lg { height: 34px; padding: 0 16px; border-radius: var(--radius-sm); }
.seg { display: inline-flex; background: var(--bg-inset); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 5px; height: 24px; padding: 0 12px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text-2); }
.seg button.on { background: var(--bg-raised); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; padding: 2px 7px; border-radius: 20px; background: var(--bg-inset); color: var(--text-2); text-transform: uppercase; }
.badge.accent { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: 0 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.home { flex: 1; overflow-y: auto; padding: 8px 32px 40px; }
.home-header { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 22px; }
.home-header h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
.project-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.project-card { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; box-shadow: var(--shadow-card); transition: transform .12s, box-shadow .12s; position: relative; }
.project-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-pop); }
.project-card .icon { width: 48px; height: 48px; border-radius: 11px; margin-bottom: 12px; }
.project-card h3 { margin: 0 0 3px; font-size: 14px; font-weight: 600; }
.project-card .meta { color: var(--text-2); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.project-card .kebab { position: absolute; top: 10px; right: 10px; opacity: 0; transition: opacity .12s; }
.project-card:hover .kebab { opacity: 1; }
.card-new { border: 1.5px dashed var(--border-strong); background: transparent; box-shadow: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-2); min-height: 132px; }
.card-new:hover { color: var(--accent); border-color: var(--accent); background: var(--bg-hover); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 80px 20px; color: var(--text-2); text-align: center; }
.empty h2 { color: var(--text); font-size: 17px; margin: 0; }
.modal-veil { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal { width: 460px; max-width: calc(100vw - 48px); background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 20px; }
.modal h2 { margin: 0 0 16px; font-size: 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
.field input[type="text"], .field input[type="password"], .field select, .field textarea { width: 100%; height: 30px; padding: 0 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.type-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.type-option { border: 1.5px solid var(--border); border-radius: var(--radius); padding: 12px; cursor: pointer; background: transparent; text-align: left; }
.type-option.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.type-option h4 { margin: 6px 0 2px; font-size: 13px; }
.type-option p { margin: 0; font-size: 11.5px; color: var(--text-2); line-height: 1.4; }
.builder { flex: 1; min-width: 0; display: flex; }
.chat-pane { width: 380px; min-width: 320px; flex: 0 0 auto; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--bg-sidebar); backdrop-filter: blur(20px); }
.chat-scroll { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 12px; }
.msg-user { align-self: flex-end; max-width: 85%; background: var(--accent); color: var(--accent-text); padding: 8px 12px; border-radius: 14px 14px 4px 14px; font-size: 13px; line-height: 1.45; white-space: pre-wrap; user-select: text; }
.msg-agent { align-self: stretch; display: flex; flex-direction: column; gap: 6px; }
.msg-agent .summary { font-size: 13px; line-height: 1.5; white-space: pre-wrap; user-select: text; }
.msg-agent .vtag { align-self: flex-start; }
.steps { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-raised); overflow: hidden; }
.step { border-bottom: 1px solid var(--border); }
.step:last-child { border-bottom: 0; }
.step-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border: 0; background: transparent; cursor: pointer; font-size: 12px; text-align: left; }
.step-row:hover { background: var(--bg-hover); }
.step-row .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-ok { color: var(--green); }
.status-fail { color: var(--red); }
.step-detail { margin: 0; padding: 8px 12px; font-family: var(--mono); font-size: 11px; background: var(--bg-inset); color: var(--text-2); white-space: pre-wrap; user-select: text; max-height: 200px; overflow-y: auto; }
.composer { padding: 10px 12px 12px; border-top: 1px solid var(--border); }
.composer-box { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-raised); padding: 8px; }
.composer textarea { width: 100%; border: 0; outline: none; background: transparent; resize: none; min-height: 40px; max-height: 140px; line-height: 1.45; padding: 2px 4px; user-select: text; }
.composer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.preview-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.preview-toolbar { height: 40px; flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.preview-body { flex: 1; min-height: 0; position: relative; overflow-y: auto; }
.preview-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--text-2); text-align: center; padding: 24px; }
.preview-frame { width: min(78%, 720px); aspect-ratio: 16/10; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-raised); box-shadow: var(--shadow-pop); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
.versions { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.version-row { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-raised); padding: 10px 12px; }
.version-row .tag { font-family: var(--mono); font-weight: 600; font-size: 12px; }
.version-row .msg { flex: 1; }
.version-row .when { color: var(--text-3); font-size: 11.5px; }
.files { display: flex; height: 100%; min-height: 0; }
.file-tree { width: 220px; flex: 0 0 auto; overflow-y: auto; border-right: 1px solid var(--border); padding: 10px 6px; }
.tree-row { display: flex; align-items: center; gap: 6px; width: 100%; padding: 3px 8px; border: 0; background: transparent; border-radius: 5px; cursor: pointer; font-size: 12.5px; text-align: left; color: var(--text); }
.tree-row:hover { background: var(--bg-hover); }
.tree-row.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.file-view { flex: 1; min-width: 0; overflow: auto; }
.file-view pre { margin: 0; padding: 14px 18px; font-family: var(--mono); font-size: 12px; line-height: 1.55; user-select: text; color: var(--text); }
.settings { flex: 1; overflow-y: auto; padding: 10px 32px 48px; }
.settings h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 16px 0 20px; }
.settings h2 { font-size: 14px; font-weight: 600; margin: 26px 0 10px; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.engine-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-raised); padding: 14px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 9px; }
.engine-card header { display: flex; align-items: center; gap: 10px; }
.engine-card header .names { flex: 1; min-width: 0; }
.engine-card h3 { margin: 0; font-size: 13.5px; }
.engine-card .sub { color: var(--text-2); font-size: 11.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.dot.ok { background: var(--green); }
.dot.warn { background: var(--amber); }
.dot.bad { background: var(--red); }
.engine-card .hint { font-size: 12px; color: var(--text-2); line-height: 1.45; }
.engine-card .row { display: flex; gap: 8px; align-items: center; }
.engine-card .row input { flex: 1; height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); outline: none; }
.engine-card .row select { height: 28px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); padding: 0 6px; }
.test-result { font-size: 12px; }
.test-result.ok { color: var(--green); }
.test-result.bad { color: var(--red); }
.settings .form-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-raised); margin-bottom: 8px; }
.settings .form-row .lbl { font-weight: 500; }
.settings .form-row .desc { color: var(--text-2); font-size: 12px; margin-top: 2px; max-width: 480px; }
.settings .form-row select, .settings .form-row input[type="text"] { height: 28px; min-width: 220px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); padding: 0 8px; outline: none; }
.toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
.toast { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-pop); padding: 10px 14px; font-size: 12.5px; display: flex; align-items: center; gap: 10px; max-width: 380px; animation: toast-in .18s ease-out; }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } }
.mock-pill { position: fixed; bottom: 14px; left: 14px; z-index: 80; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 3px 9px; border-radius: 20px; background: color-mix(in srgb, var(--amber) 20%, transparent); color: var(--amber); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>

};

function icon(name, size, color, cls) {

function timeAgo(iso) {
  var s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}

  el.innerHTML = ic + '<span>' + esc(text) + '</span>';

}

/* ============================== simulated agent ============================== */
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function simulateRun(projectId, prompt, mode) {
  var p = proj(projectId);
  var chat = state.chats[projectId] = state.chats[projectId] || [];
  chat.push({ id: uid(), role: 'user', text: prompt });
  p.status = 'agent-running';
  var token = ++state.runToken;
  var msg = { id: uid(), role: 'agent', text: '', events: [], inProgress: true };
  chat.push(msg);
  render();

  function alive() { return state.runToken === token && p.status === 'agent-running'; }
  function push(kind, label, detail) {
    msg.events.push({ id: uid(), kind: kind, label: label, status: 'running', detail: detail });
    render();
  }
  function settle(status) {
    var last = msg.events[msg.events.length - 1];
    if (last) last.status = status;
    render();
  }

  (async function () {
    push('sparkles', mode === 'plan' ? 'Drafting a plan' : 'Planning approach');
    await sleep(900); if (!alive()) return; settle('ok');

    if (mode === 'plan') {
      msg.text = "Here's the plan:\n\n1. Add a settings pane for the requested change.\n2. Wire it to persisted state via the store bridge.\n3. Update the main view to react to the new setting.\n\nSwitch to Build and send again to apply.";
      msg.inProgress = false;
      p.status = 'idle';
      render();
      return;
    }
    push('eye', 'Reading project files');
    await sleep(700); if (!alive()) return; settle('ok');
    push('file-code', 'Editing src/renderer/App.tsx', '+ implemented request\n~ refactored view state');
    await sleep(1400); if (!alive()) return; settle('ok');
    push('terminal', 'npm run typecheck');
    await sleep(1000); if (!alive()) return; settle('ok');
    push('shield', 'Validation gate — lint, smoke test, screenshot');
    await sleep(1200); if (!alive()) return; settle('ok');

    p.latestVersion += 1;
    p.lastEditedAt = nowIso();
    msg.text = 'Done — ' + (prompt.length > 60 ? prompt.slice(0, 57) + '…' : prompt);
    msg.versionTag = 'v' + p.latestVersion;
    msg.inProgress = false;
    p.status = 'idle';
    render();
  })();
}

/* ============================== actions ============================== */
document.getElementById('root').addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]');
  if (!t) return;
  var act = t.dataset.act;
  var p = currentProject();

  // Veil closes only when the backdrop itself is clicked (not clicks inside the dialog).
  if (act === 'closemodal' && t.classList.contains('modal-veil') && ev.target !== t) return;

  switch (act) {
    case 'back': state.route = { view: 'home' }; state.tab = 'preview'; render(); break;
    case 'settings': state.route = { view: 'settings' }; render(); break;
    case 'open': state.route = { view: 'builder', projectId: t.dataset.id }; state.tab = 'preview'; state.draft = ''; render(); break;
    case 'del': {
      ev.stopPropagation();
      var dp = proj(t.dataset.id);
      if (dp && window.confirm('Delete “' + dp.name + '”? The project folder is moved to Trash.')) {
        state.projects = state.projects.filter(function (x) { return x.id !== dp.id; });
        toast('info', 'Deleted ' + dp.name);
        render();
      }
      break;
    }
    case 'new': state.modal = 'new'; state.form = { name: '', type: 'mac-app', engine: state.settings.defaultEngine }; render(); break;
    case 'closemodal': state.modal = null; render(); break;
    case 'ptype': state.form.name = (document.getElementById('npName') || {}).value || state.form.name; state.form.type = t.dataset.type; render(); break;
    case 'create': {
      var name = ((document.getElementById('npName') || {}).value || '').trim();
      var engineSel = (document.getElementById('npEngine') || {}).value || state.form.engine;
      if (!name) break;
      var np = { id: uid(), name: name, type: state.form.type, engine: engineSel, status: 'idle', latestVersion: 0,
        icon: appIcon(Math.floor(Math.random() * 360), name.charAt(0).toUpperCase()), lastEditedAt: nowIso() };
      state.projects.unshift(np);
      state.chats[np.id] = [];
      state.modal = null;
      state.route = { view: 'builder', projectId: np.id };
      state.tab = 'preview'; state.draft = '';
      render();
      break;
    }
    case 'mode': state.mode = t.dataset.mode; state.draft = (document.getElementById('composer') || {}).value || ''; render(); break;
    case 'send': {
      var text = ((document.getElementById('composer') || {}).value || '').trim();
      if (!text || !p || p.status === 'agent-running') break;
      state.draft = '';
      simulateRun(p.id, text, state.mode);
      break;
    }
    case 'cancel': if (p) { state.runToken++; p.status = 'idle'; var c = state.chats[p.id]; var last = c[c.length - 1];
      if (last && last.role === 'agent' && last.inProgress) { last.inProgress = false; last.text = 'Canceled.'; var le = last.events[last.events.length - 1]; if (le && le.status === 'running') le.status = 'fail'; }
      render(); } break;
    case 'tab': state.tab = t.dataset.tab; state.draft = (document.getElementById('composer') || {}).value || ''; render(); break;
    case 'run': if (p) { p.status = 'app-running'; render(); } break;
    case 'stop': if (p) { p.status = 'idle'; render(); } break;
    case 'export': {
      if (!p) break;
      p.status = 'exporting';
      toast('info', p.type === 'mac-app' ? 'Building DMG…' : 'Building ZIPs…');
      render();
      var pid = p.id;
      sleep(2200).then(function () {
        var pp = proj(pid); if (!pp) return;
        pp.status = 'idle';
        var arts = pp.type === 'mac-app'
          ? [pp.name + '-1.0.' + pp.latestVersion + '.dmg']
          : [pp.name + '-1.0.' + pp.latestVersion + '-chrome.zip', pp.name + '-1.0.' + pp.latestVersion + '-firefox.zip'];
        toast('ok', 'Exported ' + arts.join(', '));
        render();
      });
      break;
    }
    case 'step': state.openSteps[t.dataset.id] = !state.openSteps[t.dataset.id]; state.draft = (document.getElementById('composer') || {}).value || ''; render(); break;
    case 'dir': state.openDirs[t.dataset.path] = !state.openDirs[t.dataset.path]; render(); break;
    case 'file': state.selFile = t.dataset.path; render(); break;
    case 'editor': toast('info', 'Would open the project in your editor.'); break;
    case 'revert': if (window.confirm('Revert to ' + t.dataset.tag + '? Later versions stay in history.')) toast('ok', 'Reverted to ' + t.dataset.tag); break;
    case 'savekey': {
      var inp = document.querySelector('[data-keyinput="' + t.dataset.engine + '"]');
      if (!inp || !inp.value.trim()) break;
      var e1 = state.engines.filter(function (x) { return x.id === t.dataset.engine; })[0];
      e1.authenticated = true; e1.detail = '';
      toast('ok', ENGINE_LABELS[e1.id].name + ' key saved to Keychain');
      render();
      break;
    }
    case 'rmkey': {
      var e2 = state.engines.filter(function (x) { return x.id === t.dataset.engine; })[0];
      e2.authenticated = false; e2.detail = 'Add an API key to enable.';
      render();
      break;
    }
    case 'test': {
      var eid = t.dataset.engine;
      state.testing[eid] = true; delete state.testResult[eid];
      render();
      sleep(1200).then(function () {
        var e3 = state.engines.filter(function (x) { return x.id === eid; })[0];
        state.testing[eid] = false;
        state.testResult[eid] = (e3.installed && e3.authenticated)
          ? { ok: true, message: 'Round-trip OK — engine responded in 1.2s' }
          : { ok: false, message: e3.detail || 'Engine unavailable' };
        render();
      });
      break;
    }
  }
});

document.getElementById('root').addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.id === 'composer') {
    state.draft = el.value;
    var btn = document.querySelector('[data-act="send"]');
    if (btn) btn.disabled = !el.value.trim();
  }
  if (el.id === 'npName') {
    state.form.name = el.value;
    var cbtn = document.getElementById('npCreate');
    if (cbtn) cbtn.disabled = !el.value.trim();
  }
});

document.getElementById('root').addEventListener('change', function (ev) {
  var el = ev.target;
  var act = el.dataset.act;
  if (act === 'model') {
    var e = state.engines.filter(function (x) { return x.id === el.dataset.engine; })[0];
    e.selectedModel = el.value;
  } else if (act === 'defengine') state.settings.defaultEngine = el.value;
  else if (act === 'projdir') state.settings.projectsDir = el.value;
  else if (act === 'signid') { state.settings.signingIdentity = el.value; render(); }
  else if (act === 'notarize') state.settings.notarize = el.checked;
  else if (el.id === 'npEngine') state.form.engine = el.value;
});

document.addEventListener('keydown', function (ev) {
  var meta = ev.metaKey || ev.ctrlKey;
  if (meta && ev.key === 'n' && state.route.view === 'home') {
    ev.preventDefault();
    state.modal = 'new';
    state.form = { name: '', type: 'mac-app', engine: state.settings.defaultEngine };
    render();
  }
  if (meta && ev.key === 'Enter' && document.activeElement && document.activeElement.id === 'composer') {
    ev.preventDefault();
    var btn = document.querySelector('[data-act="send"]');
    if (btn && !btn.disabled) btn.click();
  }
  if (ev.key === 'Enter' && document.activeElement && document.activeElement.id === 'npName') {
    var create = document.getElementById('npCreate');
    if (create && !create.disabled) create.click();
  }
  if (ev.key === 'Escape' && state.modal) { state.modal = null; render(); }
});

render();
</script>
</body>
</html>
